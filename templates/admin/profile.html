{% extends "base.html" %}

{% block title %}Admin Profile – Smart Child Adoption Platform{% endblock %}
{% block header_title %}Admin Profile Management{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card-custom">
            <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                <div class="avatar-circle fs-3" style="width: 54px; height: 54px;">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <div>
                    <h4 class="fw-bold mb-0">{{ user.name }}</h4>
                    <span class="badge badge-pink">System Administrator</span>
                    <span class="text-muted small ms-2"><i class="fa-solid fa-envelope me-1"></i>{{ user.email }}</span>
                </div>
            </div>

            <form action="{{ url_for('admin.profile') }}" method="POST">
                <h6 class="fw-bold text-dark mb-3"><i class="fa-solid fa-user-gear text-pink me-2"></i>Administrator Account Details</h6>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Admin Name</label>
                        <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Phone Number</label>
                        <input type="text" name="phone" class="form-control" value="{{ user.phone or '' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">New Password (leave blank to keep current)</label>
                        <input type="password" name="new_password" class="form-control" placeholder="••••••••">
                    </div>
                </div>

                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-pink px-4 py-2">
                        <i class="fa-solid fa-floppy-disk me-2"></i> Update Admin Profile
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
